<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; connect-src 'self' http://localhost:5000 http://127.0.0.1:5000 http://127.0.0.1:5500; font-src 'self' data: https://fonts.gstatic.com;"
    />
    <title>Login - Pengangkut Sampah</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link rel="stylesheet" href="../../assets/css/style.css" />
    <link rel="stylesheet" href="../../assets/css/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-header">
          <h1>Masuk</h1>
          <p>Masukkan email dan password Anda</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-with-icon">
              <span class="material-icons input-icon">email</span>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="nama@email.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <span class="material-icons input-icon">lock</span>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                required
              />
              <span class="material-icons toggle-password" id="togglePassword"
                >visibility_off</span
              >
            </div>
          </div>

          <div class="form-group">
            <button type="submit" class="btn btn-primary btn-block">
              Masuk
            </button>
          </div>

          <div class="form-footer">
            <p>Belum punya akun? <a href="signup.html">Daftar di sini</a></p>
          </div>
        </form>

        <div
          id="errorMessage"
          class="alert alert-error"
          style="display: none"
        ></div>
      </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/login.js"></script>
  </body>
</html>
